<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved/system theme before first paint to avoid a color flash.
      (function () {
        var saved = window.localStorage.getItem('openswap-theme')
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.classList.toggle('dark', theme === 'dark')
      }())
    </script>
    <script>
      // Restore path encoded by 404.html redirect
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          })
          window.history.replaceState(
            null, null,
            decoded.shift() + (decoded.length ? '?' + decoded.join('&') : '') + l.hash
          )
        }
      }(window.location))
    </script>
